name: Build APK Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: '17'

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Installer le workload MAUI Android
        run: dotnet workload install maui-android

      # On ne cible qu'Android : iOS et Mac Catalyst ne se compilent pas sous Linux.
      - name: Compiler l'APK
        run: >
          dotnet publish CalculateurAge.csproj
          -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:AndroidPackageFormat=apk
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: CalculateurAge-apk
          path: publish/*-Signed.apk
